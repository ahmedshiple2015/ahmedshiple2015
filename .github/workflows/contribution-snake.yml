name: Contribution snake
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    paths:
      - '.github/workflows/contribution-snake.yml'
permissions:
  contents: write
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ahmedshiple2015
          outputs: |
            assets/contribution-snake.svg?color_snake=#7148b8
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=#bea5ff
      - name: Save generated animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-snake.svg assets/contribution-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution snake [skip ci]'
            git push
          fi
